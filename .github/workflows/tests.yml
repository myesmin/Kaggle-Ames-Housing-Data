# Two jobs, because they fail for different reasons and one of them is allowed to be
# slow.
#
#   tests           every push. Builds the property frame from the two raw sources
#                   (De Cock and the geocodes, cached between runs) because the
#                   leakage tests need it. No FRED, Zillow or HMDA, so no third party
#                   can turn this red. The data-contract tests skip themselves when
#                   the macro and external files are absent.
#   data-contracts  weekly, and on demand. Downloads all twelve external sources and
#                   asserts the shapes and date ranges quoted in DATA_SOURCES.md.
#                   This is the job that tells me when FRED revises history or Zillow
#                   moves a URL -- a failure here is news about the world, not about
#                   the code, which is why it does not gate a push.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # Mondays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unit, leakage and service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Cache the raw property sources
        uses: actions/cache@v4
        with:
          path: |
            data/raw/AmesHousing.txt
            data/raw/ames_geo.rda
          key: raw-property-sources-v1

      - name: Build the property frame
        # The leakage tests read data/processed/properties.parquet, which is gitignored.
        run: python -m ames.data --properties-only

      - name: Run tests
        run: pytest tests/ -q

      - name: Confirm the leakage regressions actually ran
        # A suite that silently skips its most important tests is worse than no suite.
        run: pytest tests/test_leakage.py tests/test_service.py -q --no-header -p no:warnings

  data-contracts:
    name: external data contracts
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Download every source
        run: python -m ames.data

      - name: Assert the documented shapes still hold
        run: pytest tests/test_data.py -q

  image:
    name: serving image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ames-avm .

      - name: Start
        run: docker run -d --name avm -p 7860:7860 ames-avm

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:7860/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker logs avm; exit 1

      - name: Value a property through the running container
        run: |
          curl -fsS -X POST http://localhost:7860/value \
            -H 'content-type: application/json' \
            -d '{"neighborhood":"NAmes","gr_liv_area":1456,"overall_qual":6,
                 "overall_cond":5,"year_built":1977,"year_remodeled":1977,
                 "total_bsmt_sf":1040,"garage_cars":2,"full_bath":2,"lot_area":9600}' \
            | tee /dev/stderr | grep -q '"value"'

      - name: Stop
        if: always()
        run: docker rm -f avm
